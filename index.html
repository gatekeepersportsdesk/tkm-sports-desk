    <script>
      // Ignore Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        var file = (event && event.filename) || '';
        if (msg.includes('WebSocket') || msg.includes('@vite/client') || file.includes('@vite/client')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        var stack = (reason && reason.stack) || '';
        if (msg.includes('WebSocket') || stack.includes('@vite/client') || stack.includes('createWebSocketModuleRunnerTransport')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
